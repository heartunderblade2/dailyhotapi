name: 自动抓取热榜数据

on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  fetch-hot-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 requests 库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 运行抓取脚本
        run: python fetch_hot.py

      - name: 5. 提交并推送到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动拉取热搜数据: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
