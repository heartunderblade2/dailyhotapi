name: 自动抓取热榜数据

on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  fetch-hot-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 运行抓取脚本
        run: python auto_fetch_and_filter.py

      - name: 5. 提交并推送到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存所有新建和修改的文件（包括 data/、.xlsx 和 .json）
          git add .
          
          # 检查暂存区是否有需要提交的更改
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "自动拉取数据并更新表格: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "数据没有变化，跳过提交"
          fi
