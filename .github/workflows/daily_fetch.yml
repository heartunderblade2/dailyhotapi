name: 自动抓取热榜数据

on:
  schedule:
    # 每天 UTC 凌晨 2:00 (北京时间早上 10:00) 运行
    - cron: '20 2 * * *'
  workflow_dispatch: 
    # 允许手动点击触发

permissions:
  contents: write # 必须加这一段！授予 Action 写入仓库的权限

jobs:
  fetch-hot-data:
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的云端 Linux

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装 requests 库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 运行抓取脚本
        run: python fetch_hot.py

      - name: 5. 提交并推送到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加新生成的 data 文件夹
          git add data/
          
          # 检查是否有文件更新，有的话就 Commit 并 Push
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动拉取热搜数据: $(date +'%Y-%m-%d')" && git push)
