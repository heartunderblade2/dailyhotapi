name: LLM Eval 国内模型

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/run_eval_domes.py

      - name: Upload result excel
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: outputs/model_eval_results_domes.xlsx
