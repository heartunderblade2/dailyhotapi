name: LLM Eval Annotation Parallel (Resume)

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      # 设置为 false：如果某个文件（比如kimi）报错中断，其他模型依然会继续跑完
      fail-fast: false 
      matrix:
        # 在这里列出你需要继续填补的半成品文件
        file: 
          - eval_results_kimi_fixed_annotated.xlsx
          - eval_results_glm_fixed_annotated.xlsx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run annotation (${{ matrix.file }})
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # 动态读取矩阵中的半成品文件名并执行断点续传扫描
          python annotate_parallel.py ${{ matrix.file }}

      - name: Upload result excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # 动态命名产物包，防止不同任务的文件互相覆盖
          name: annotation-results-${{ matrix.file }}
          path: |
            *_2.xlsx
