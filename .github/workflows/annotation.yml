name: LLM Eval Annotation Parallel

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      # 设置为 false：如果某个文件（比如kimi）报错中断，其他 4 个模型依然会继续跑完
      fail-fast: false 
      matrix:
        # 在这里列出你需要并行处理的所有文件
        file: 
          - result_deepseek.xlsx
          # - result_glm.xlsx
          # - result_kimi.xlsx
          # - result_qwen.xlsx
          # - result_gemini.xlsx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run annotation (${{ matrix.file }})
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # 动态读取矩阵中的文件名并执行
          python annotate_parallel.py ${{ matrix.file }}

      - name: Upload result excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # 动态命名产物包，防止 5 个任务的文件互相覆盖
          name: annotation-results-${{ matrix.file }}
          path: |
            *_annotated.xlsx
            progress_*.json
